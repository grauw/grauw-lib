<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="en" xml:lang="en">

		      add a test for duplicate includes
		      add a test for multiple modules in a single file

	<head>
		<title>Module loading test</title>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
		<script type="text/javascript">
			var sLog = '';
			var bLoad = false;
			function log(sMessage) {
				sLog += sMessage + '\n';
				if (bLoad)
					output();
			}
			function output() {
				document.getElementById('log').value = sLog;
			}
			function getCurrentScriptIE() {
				var aScripts = document.getElementsByTagName('script');
				for (var i = 0; i < aScripts.length; i++) {
					if (aScripts[i].readyState == 'interactive')
						return aScripts[i];
				}
				return null;
			}
			function getCurrentScriptName() {
				var oScript = getCurrentScriptIE();
				if (oScript)
					return oScript.src.substring(oScript.src.lastIndexOf('/') + 1);
				return 'not IE';
			}
		</script>
		<script src="../../src/grauw-lib.js" type="text/javascript"></script>
		<script src="A.js" type="text/javascript"></script>
		<script type="text/javascript">
			log('$ execute: ' + getCurrentScriptName());
			gl.module(
				'module_$',
				[],
				function(oModule) {
					if (oModule.getURI().indexOf('module.html') == -1)
						log('$ module ERROR - Wrong URI: ' + oModule.getURI());
					else
						log('$ module OK');
				}
			);
		</script>
		<script src="B.js" type="text/javascript"></script>
		<script src="C.js" type="text/javascript"></script>
	</head>
	<body onload="bLoad = true;output();">
		<h1>Module loading test</h1>
		
		<textarea id="log" cols="80" rows="25"></textarea>
	</body>
</html>
